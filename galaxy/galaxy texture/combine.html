<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
        }
        canvas { 
            display: block; 
            background: transparent; 
        }
        img.background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>
    <img src="resources/galaxies.jpg" class="background" alt="Galaxy Background">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Camera position (adjusted for larger galaxy)
        camera.position.set(0, 2.5, 5); // Increased z from 15 to 20
        camera.lookAt(0, 0, 0);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enabled = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;
        controls.rotateSpeed = 0.5;

        // Enable controls on first click
        let isFirstClick = true;
        document.addEventListener('mousedown', () => {
            if (isFirstClick) {
                controls.enabled = true;
                isFirstClick = false;
            }
        });

        // Galaxy parameters
        const numStarsPerArm = 7000;
        const numArms = 6;
        const totalStars = numStarsPerArm * numArms;
        const galaxyRadius = 15; // Increased from 5 to make galaxy bigger
        const a = 0.0017; // Increased from 0.0005 for larger spiral
        const b = 0.25; // Spiral tightness
        const armSeparation = (2 * Math.PI) / numArms;
        const exclusionRadius = 0.4; // Approx. 5 pixels at z=15, FOV=75, height=1080px

        // Texture loader
        const textureLoader = new THREE.TextureLoader();
        const textures = [
            textureLoader.load(
                'resources/feathered60.png',
                () => console.log('feathered60.png loaded'),
                undefined,
                (err) => console.error('Error loading feathered60.png:', err)
            ),
            textureLoader.load(
                'resources/sprite120.png',
                () => console.log('sprite120.png loaded'),
                undefined,
                (err) => console.error('Error loading sprite120.png:', err)
            )
        ];
        textures.forEach(tex => {
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
        });

        // Particle system for stars
        const starsGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(totalStars * 3);
        const colors = new Float32Array(totalStars * 3);
        const textureIndices = new Float32Array(totalStars);

        let starIndex = 0;
        for (let arm = 0; arm < numArms; arm++) {
            const armOffset = arm * armSeparation;
            for (let i = 0; i < numStarsPerArm; i++) {
                const theta = (i / numStarsPerArm) * 2 * Math.PI * 5;
                const finalTheta = theta + armOffset;

                const r = a * Math.exp(b * theta);
                const scatter = (Math.random() - 0.5) * 0.5; // Increased from 0.3 to 0.5
                const x = (r + scatter) * Math.cos(finalTheta);
                const z = (r + scatter) * Math.sin(finalTheta);
                const y = (Math.random() - 0.5) * 0.5; // Increased from 0.3 to 0.5

                // Skip stars within exclusion radius
                const distance = Math.sqrt(x * x + z * z);
                if (distance < exclusionRadius) continue;

                positions[starIndex * 3] = x;
                positions[starIndex * 3 + 1] = y;
                positions[starIndex * 3 + 2] = z;

                const color = new THREE.Color();
                if (Math.random() < 0.05) {
                    color.set(0xffffff);
                } else {
                    const blueTint = 0xadd8e6;
                    color.set(blueTint);
                    const brightness = THREE.MathUtils.lerp(0.5, 1.0, 1 - distance / galaxyRadius);
                    color.multiplyScalar(brightness);
                }
                colors[starIndex * 3] = color.r;
                colors[starIndex * 3 + 1] = color.g;
                colors[starIndex * 3 + 2] = color.b;

                textureIndices[starIndex] = Math.random() < 0.5 ? 0 : 1;
                starIndex++;
            }
        }

        // Truncate arrays to actual number of stars
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, starIndex * 3), 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors.slice(0, starIndex * 3), 3));
        starsGeometry.setAttribute('textureIndex', new THREE.BufferAttribute(textureIndices.slice(0, starIndex), 1));

        // Star material
        const starsMaterial = new THREE.ShaderMaterial({
            uniforms: {
                textures: { value: textures },
                pointSize: { value: 2.0 }
            },
            vertexShader: `
                attribute float textureIndex;
                varying vec3 vColor;
                varying float vTextureIndex;
                uniform float pointSize;
                void main() {
                    vColor = color;
                    vTextureIndex = textureIndex;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = pointSize;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D textures[2];
                varying vec3 vColor;
                varying float vTextureIndex;
                void main() {
                    vec4 texColor;
                    if (vTextureIndex < 0.5) {
                        texColor = texture2D(textures[0], gl_PointCoord);
                    } else {
                        texColor = texture2D(textures[1], gl_PointCoord);
                    }
                    if (texColor.a < 0.1) discard;
                    gl_FragColor = vec4(vColor * texColor.rgb, texColor.a);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        console.log('Stars added:', stars);

        // Black sphere (unchanged size)
        const sphereGeometry = new THREE.SphereGeometry(0.167, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            roughness: 0.1,
            metalness: 0.5
        });
        const blackSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(blackSphere);
        console.log('Black sphere added:', blackSphere);

        // Create the glass atmosphere with distortion and transparent center
        const atmosphereGeometry = new THREE.SphereGeometry(0.18, 32, 32);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tBackground: { value: null },
                refractionRatio: { value: 0.4 },
                opacity: { value: 0.1 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vWorldPosition;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 worldPosition = modelMatrix * vec4(position, 0.9);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 0.9);
                }
            `,
            fragmentShader: `
                uniform sampler2D tBackground;
                uniform float refractionRatio;
                uniform float opacity;
                varying vec3 vNormal;
                varying vec3 vWorldPosition;

                void main() {
                    // Compute the refracted direction
                    vec3 viewDirection = normalize(vWorldPosition - cameraPosition);
                    vec3 refracted = refract(viewDirection, vNormal, refractionRatio);

                    // Convert the refracted direction to UV coordinates for sampling the background
                    vec2 uv;
                    uv.x = atan(refracted.z, refracted.x) / (2.0 * 3.14159) + 0.5;
                    uv.y = asin(refracted.y) / 3.14159 + 0.5;

                    // Sample the background texture
                    vec4 backgroundColor = texture2D(tBackground, uv);

                    // Compute how aligned the normal is with the view direction (center vs edge)
                    float centerFactor = abs(dot(vNormal, viewDirection));
                    // Make the center more transparent (higher centerFactor means closer to center)
                    float adjustedOpacity = opacity * (0.099 - centerFactor * 0.0000000001); // Reduce opacity at the center

                    // Add a slight Fresnel effect for realism
                    float fresnel = pow(2.0 - centerFactor, 0.1);
                    vec4 glassColor = vec4(0.72, 0.72, 0.72, adjustedOpacity + fresnel * 0.01);

                    // Blend the refracted background with the glass color
                    gl_FragColor = mix(backgroundColor, glassColor, glassColor.a);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });


        // Load background texture
        textureLoader.load(
            'resources/galaxies.jpg',
            (texture) => {
                scene.background = texture;
                atmosphereMaterial.uniforms.tBackground.value = texture;
                console.log('Background texture loaded');
            },
            undefined,
            (err) => {
                console.error('Error loading background texture:', err);
                scene.background = new THREE.Color(0x000000);
            }
        );

        const glassAtmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(glassAtmosphere);
        console.log('Atmosphere added:', glassAtmosphere);

        // Ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.99);
        scene.add(ambientLight);
        console.log('Ambient light added:', ambientLight);

        // Animation
        const rotationSpeed = 0.001;
        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += rotationSpeed;
            blackSphere.rotation.y += -0.01;
            glassAtmosphere.rotation.y += -0.01;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // How to adjust galaxy size and star proximity:
        // - Increase 'galaxyRadius' (e.g., galaxyRadius = 15) to make the galaxy even larger.
        // - Increase 'a' (e.g., a = 0.002) to scale the spiral outward for a bigger galaxy.
        // - Decrease 'a' (e.g., a = 0.0003) to pull stars closer to the center.
        // - Increase 'b' (e.g., b = 0.3) to make the spiral tighter, with more windings.
        // - Example for larger galaxy: `const galaxyRadius = 15; const a = 0.002;`
        // - Example for closer stars: `const a = 0.0003; const b = 0.3;`
        // - Current values: galaxyRadius = 10, a = 0.001, b = 0.25
    </script>
</body>
</html>
